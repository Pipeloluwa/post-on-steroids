<div
    class="w-full h-full flex flex-col overflow-hidden bg-(--postonsteroids-bg-primary) text-(--postonsteroids-text-primary) transition-colors duration-300 relative">

    <!-- Suspense Loader Overlay -->
    @if (!sidebarService.isHydrated()) {
    <div class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-(--postonsteroids-bg-primary)">
        <div class="relative w-24 h-24 flex items-center justify-center">
            <!-- Animated rings -->
            <div
                class="absolute inset-0 border-4 border-(--postonsteroids-accent)/20 rounded-full animate-[spin_3s_linear_infinite]">
            </div>
            <div
                class="absolute inset-0 border-4 border-transparent border-t-(--postonsteroids-accent) rounded-full animate-spin">
            </div>
            <!-- Logo/Icon placeholder -->
            <img src="/icons/onsteroids-icon.svg" alt="OnSteroids" width="40" height="40" loading="eager" fetchpriority="high" class="size-10 relative z-10" />
        </div>
        <div class="mt-8 flex flex-col items-center gap-2">
            <h1 class="text-2xl font-black tracking-tighter text-(--postonsteroids-text-primary)">
                OnSteroids<span class="text-(--postonsteroids-accent)">.</span>
            </h1>
            <p class="text-xs font-medium text-(--postonsteroids-text-muted) tracking-widest uppercase animate-pulse">
                Initializing Workspace
            </p>
        </div>
    </div>
    }

    <app-navbar-component [title]="title()" [isLoggedIn]="authService.isLoggedIn()"
        [userEmail]="authService.userEmail()" (onToggleAuth)="toggleAuthModal()" (onLogout)="handleLogout()" />


    <!-- Body -->
    <div class="h-full flex flex-col-reverse md:flex-row overflow-hidden relative">
        <app-menu-component class="shrink-0 z-10" />

        <div class="w-full h-full flex flex-col overflow-hidden main-content-area min-w-0">
            <router-outlet />
        </div>
    </div>

    <!-- Modals & Notifications -->
    <app-auth-modal-component [show]="authService.showAuthModal()" [isOtpSent]="authService.isOtpSent()"
        [isAuthenticating]="authService.isAuthenticating()" [errorMessage]="authService.errorMessage()"
        [successMessage]="authService.successMessage()" [(userEmail)]="authService.userEmail"
        [(otp)]="authService.otp" (onClose)="closeAuthModal()" (onContinueWithoutSignIn)="closeAuthModal()" (onSendOtp)="sendOtp()"
        (onAuthenticate)="authenticate()" (onBackToEmail)="authService.isOtpSent.set(false)" />

    <!-- Offline Banner -->
    @if (!networkService.isOnline()) {
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-x-3 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/20 shadow-xl backdrop-blur-md animate-in fade-in slide-in-from-bottom-4 duration-300">
        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-red-500/20">
            <mat-icon class="text-[18px]! size-[18px]! text-red-500">wifi_off</mat-icon>
        </div>
        <div class="flex flex-col">
            <span class="text-[13px] font-semibold text-red-500">You are offline</span>
            <span class="text-[11px] text-red-500/80">Check your internet connection.</span>
        </div>
    </div>
    }

    <app-notification-component [show]="notificationService.show()" [message]="notificationService.message()" />
    <app-add-variable-modal-component />
</div>
