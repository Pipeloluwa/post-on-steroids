<div class="flex items-center justify-between w-full h-[34px] mb-2 gap-x-3">
    <!-- Left Section: Icon, Request Name, and Request Description -->
    <div class="flex items-center gap-x-2.5 flex-1 min-w-0">
        <div
            class="flex items-center justify-center w-6 h-6 rounded bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border) shrink-0">
            <mat-icon class="text-[14px]! size-[14px]! text-(--postonsteroids-accent)">swap_horiz</mat-icon>
        </div>

        <input type="text" [ngModel]="requestName()" (ngModelChange)="onNameChange($event)"
            class="bg-transparent border-none outline-none font-semibold text-[13px] text-(--postonsteroids-text-primary) min-w-[110px] max-w-[230px] shrink truncate"
            placeholder="Request Name" />

        <div class="h-4 w-px bg-(--postonsteroids-border)/70 shrink-0 hidden sm:block"></div>

        <input type="text" [ngModel]="requestDescription()" (ngModelChange)="onDescriptionChange($event)"
            title="Request description / purpose (used in Docs & BRD exports)"
            class="bg-(--postonsteroids-bg-tertiary)/40 hover:bg-(--postonsteroids-bg-tertiary)/70 focus:bg-(--postonsteroids-bg-tertiary) border border-transparent focus:border-(--postonsteroids-border) rounded px-2 py-1 outline-none text-[11.5px] text-(--postonsteroids-text-secondary) placeholder:text-(--postonsteroids-text-muted)/75 flex-1 min-w-[130px] truncate transition-colors hidden sm:block"
            placeholder="Add request description..." />
    </div>

    <!-- Right Section: Grouped Utilities (Cookies, Code, Docs/BRD, Lock), Share, and Unified Save + Auto-Save -->
    <div class="flex items-center gap-x-2 shrink-0">
        <!-- Grouped Request Tools & Capsule Lock Menu -->
        <div class="relative shrink-0">
            <button (click)="toggleActionsMenu($event)" type="button"
                class="h-[30px] px-2.5 flex items-center gap-x-1.5 rounded-[4px] border border-(--postonsteroids-border) bg-(--postonsteroids-bg-tertiary) hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-colors duration-200 cursor-pointer"
                title="Cookies, Code Snippets, Docs / BRD &amp; Capsule Access Lock">
                <mat-icon class="text-[14px]! size-[14px]!"
                    [class.text-(--postonsteroids-accent)]="activeLockMode() === 'unlocked'"
                    [class.text-amber-400]="activeLockMode() === 'edit-only'"
                    [class.text-red-400]="activeLockMode() === 'read-only' || activeLockMode() === 'locked'">
                    {{ activeLockMode() === 'unlocked' ? 'tune' : 'lock' }}
                </mat-icon>
                <span class="text-[11px] font-semibold tracking-tight">Options</span>
                @if (cookieCount() > 0) {
                    <span class="text-[9px] px-1 rounded bg-amber-500/20 text-amber-500 font-bold tabular-nums">{{ cookieCount() }}</span>
                }
                @if (activeLockMode() !== 'unlocked') {
                    <span class="text-[9px] px-1 rounded bg-amber-500/15 text-amber-300 font-bold uppercase">{{ activeLockMode() }}</span>
                }
                <mat-icon class="text-[13px]! size-[13px]! text-(--postonsteroids-text-muted)">expand_more</mat-icon>
            </button>

            @if (isActionsMenuOpen()) {
                <div (click)="$event.stopPropagation()"
                     class="absolute right-0 top-full mt-1.5 w-60 p-1.5 rounded-xl bg-(--postonsteroids-bg-secondary) border border-(--postonsteroids-border) shadow-2xl z-[120] text-[11.5px] flex flex-col gap-1">
                    <button (click)="isCookieModalOpen.set(true); isActionsMenuOpen.set(false)" type="button"
                        class="w-full px-2.5 py-1.5 rounded-lg hover:bg-(--postonsteroids-bg-hover) flex items-center justify-between text-left cursor-pointer text-(--postonsteroids-text-primary)">
                        <span class="flex items-center gap-2">
                            <mat-icon class="text-[15px]! size-[15px]! text-amber-500">cookie</mat-icon>
                            <span>Cookies Manager</span>
                        </span>
                        @if (cookieCount() > 0) {
                            <span class="text-[10px] px-1.5 rounded bg-amber-500/20 text-amber-500 font-bold tabular-nums">{{ cookieCount() }}</span>
                        }
                    </button>

                    <button (click)="openCurlModal(); isActionsMenuOpen.set(false)" type="button"
                        class="w-full px-2.5 py-1.5 rounded-lg hover:bg-(--postonsteroids-bg-hover) flex items-center gap-2 text-left cursor-pointer text-(--postonsteroids-text-primary)">
                        <mat-icon class="text-[15px]! size-[15px]! text-(--postonsteroids-accent)">code</mat-icon>
                        <span>Code / cURL Snippets</span>
                    </button>

                    <button (click)="openDocBrdModal(); isActionsMenuOpen.set(false)" type="button"
                        class="w-full px-2.5 py-1.5 rounded-lg hover:bg-(--postonsteroids-bg-hover) flex items-center gap-2 text-left cursor-pointer text-(--postonsteroids-text-primary)">
                        <mat-icon class="text-[15px]! size-[15px]! text-blue-400">description</mat-icon>
                        <span>Generate Docs / BRD</span>
                    </button>

                    <div class="h-px bg-(--postonsteroids-border)/60 my-0.5"></div>

                    <div class="px-2 py-1 flex items-center justify-between gap-2">
                        <span class="text-[10.5px] font-semibold text-(--postonsteroids-text-muted) flex items-center gap-1">
                            <mat-icon class="text-[13px]! size-[13px]!"
                                [class.text-amber-400]="activeLockMode() === 'edit-only'"
                                [class.text-red-400]="activeLockMode() === 'read-only' || activeLockMode() === 'locked'">
                                {{ activeLockMode() === 'unlocked' ? 'lock_open' : 'lock' }}
                            </mat-icon>
                            <span>Capsule Lock</span>
                        </span>
                        <select aria-label="Capsule Lock Mode"
                            [ngModel]="activeLockMode()"
                            (ngModelChange)="onLockModeChange($event)"
                            class="bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border) rounded px-1.5 py-1 text-[11px] font-semibold cursor-pointer text-(--postonsteroids-text-primary) outline-none">
                            @for (opt of lockModeOptions; track opt.id) {
                            <option [value]="opt.id">{{ opt.label }}</option>
                            }
                        </select>
                    </div>
                </div>
            }
        </div>

        <!-- Share Capsule Button -->
        <button (click)="shareCapsule()" [disabled]="isSharing()" type="button"
            class="h-[30px] px-2.5 flex items-center gap-x-1.5 rounded-[4px] border border-(--postonsteroids-border) bg-(--postonsteroids-bg-tertiary) hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-accent) transition-colors duration-200 cursor-pointer shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
            title="Share active capsule via link">
            @if (isSharing()) {
            <mat-icon class="text-[14px]! size-[14px]! animate-spin">sync</mat-icon>
            <span class="text-[11px] font-medium">Sharing...</span>
            } @else {
            <mat-icon class="text-[14px]! size-[14px]!">share</mat-icon>
            <span class="text-[11px] font-medium">Share</span>
            }
        </button>

        <!-- Unified Save & Auto-Save Split Group -->
        <div
            class="flex items-center h-[30px] rounded-[4px] border border-(--postonsteroids-border) bg-(--postonsteroids-bg-tertiary)">
            <button (click)="saveRequest()" [disabled]="isSaving()"
                class="px-2.5 h-full flex items-center gap-x-1.5 text-[12px] font-semibold text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                @if (isSaving()) {
                <mat-icon
                    class="text-[15px]! size-[15px]! animate-spin text-(--postonsteroids-text-secondary)">sync</mat-icon>
                } @else {
                <mat-icon class="text-[15px]! size-[15px]! text-(--postonsteroids-text-secondary)">save</mat-icon>
                }
                <span>{{ isSaving() ? 'Saving...' : 'Save' }}</span>
            </button>

            @if (isLoggedIn()) {
            <button type="button" (click)="tabStateService.toggleAutoSave()"
                class="h-full px-2 flex items-center gap-x-1 border-l border-(--postonsteroids-border) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer shrink-0"
                [attr.aria-pressed]="tabStateService.autoSaveEnabled()"
                [title]="tabStateService.autoSaveEnabled() ? 'Auto-Save is ON (Click to disable)' : 'Auto-Save is OFF (Click to enable)'">
                <mat-icon class="text-[14px]! size-[14px]! transition-colors" aria-hidden="true"
                    [class.text-(--postonsteroids-text-muted)]="!tabStateService.autoSaveEnabled()"
                    [class.text-(--postonsteroids-accent)]="tabStateService.autoSaveEnabled()"
                    [class.animate-pulse]="tabStateService.isAutoSaving()">
                    {{ !tabStateService.autoSaveEnabled() ? 'cloud_off' : (tabStateService.isAutoSaving() ? 'cloud_sync' : 'cloud_done') }}
                </mat-icon>
                <span class="text-[10.5px] text-(--postonsteroids-text-secondary) font-medium whitespace-nowrap">
                    {{ tabStateService.autoSaveEnabled() ? 'Auto On' : 'Auto Off' }}
                </span>
            </button>
            }

            @if (isSaving()) {
            <button (click)="cancelSave()" title="Cancel Save"
                class="px-2 flex items-center h-full border-l border-(--postonsteroids-border) hover:bg-red-500/10 text-status-danger transition-colors duration-200 cursor-pointer">
                <mat-icon class="text-[15px]! size-[15px]!">close</mat-icon>
            </button>
            }

            <app-scrollable-select-component [optionValues]="saveOptions" [verticalPosition]="32" [modalWidth]="170"
                [absoluteStartLeft]="false" (outputSelectedValue)="onSaveOptionSelected($event)">
                <div
                    class="px-1.5 h-full border-l border-(--postonsteroids-border) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer flex items-center justify-center">
                    @if (isExporting()) {
                    <mat-icon
                        class="text-[16px]! size-[16px]! animate-spin text-(--postonsteroids-accent)">sync</mat-icon>
                    } @else {
                    <mat-icon class="text-[16px]! size-[16px]!">expand_more</mat-icon>
                    }
                </div>
            </app-scrollable-select-component>
        </div>
    </div>

</div>

<!-- Share Link, cURL, & Transfer Modals (placed outside header flex row so Save aligns flush right) -->
<app-share-modal-component [show]="showShareModal()" [link]="generatedLink()" (onClose)="showShareModal.set(false)"
    (onCopy)="copyLink()" />
<app-curl-modal [isOpen]="isCurlModalOpen()"
    [request]="currentRequestState()"
    (closed)="isCurlModalOpen.set(false)" />
<app-doc-brd-generator-modal [isOpen]="isDocBrdModalOpen()"
    [initialScope]="'endpoint'"
    [request]="currentRequestState()"
    (closed)="isDocBrdModalOpen.set(false)" />
<app-cookie-manager-modal [isOpen]="isCookieModalOpen()"
    [defaultUrl]="currentRequestState()?.url || ''"
    (closed)="isCookieModalOpen.set(false)" />
<app-transfer-capsule-modal [isOpen]="isTransferModalOpen()"
    [requestIds]="[tabId()]"
    [initialMode]="transferMode()"
    (closed)="isTransferModalOpen.set(false)" />
