<div class="flex items-center justify-between w-full h-[32px] mb-2">
    <!-- Left Section: Icon, Name/URL and Collection -->
    <div class="flex items-center gap-x-3 flex-1">
        <!-- HTTP Icon (Placeholder style from image) -->
        <div
            class="flex items-center justify-center w-6 h-6 rounded bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border)">
            <mat-icon class="text-[14px]! size-[14px]! text-(--postonsteroids-accent)">swap_horiz</mat-icon>
        </div>

        <!-- Request Name Input (styled like the text in image) -->
        <input type="text" [ngModel]="requestName()" (ngModelChange)="onNameChange($event)"
            class="bg-transparent border-none outline-none font-semibold text-[13px] text-(--postonsteroids-text-primary) min-w-[200px] flex-1 truncate"
            placeholder="Request Name" />



        <!-- Share Capsule Button -->
        <div class="flex items-center ml-2">
            <button (click)="shareCapsule()" [disabled]="isSharing()"
                class="flex items-center gap-x-1.5 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-(--postonsteroids-accent) hover:bg-(--postonsteroids-bg-hover) rounded transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                @if (isSharing()) {
                <mat-icon class="text-[14px]! size-[14px]! animate-spin">sync</mat-icon>
                <span>Sharing...</span>
                } @else {
                <mat-icon class="text-[14px]! size-[14px]!">share</mat-icon>
                <span>Share</span>
                }
            </button>
        </div>
    </div>

    <!-- Right Section: Auto-Save Toggle + Save Button Group -->
    <div class="flex items-center gap-x-2">
        @if (isLoggedIn()) {
        <button type="button" (click)="tabStateService.toggleAutoSave()"
            class="h-[30px] px-2.5 flex items-center gap-x-1.5 rounded-[4px] border border-(--postonsteroids-border) bg-(--postonsteroids-bg-tertiary) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer shrink-0"
            [attr.aria-pressed]="tabStateService.autoSaveEnabled()"
            [title]="tabStateService.autoSaveEnabled() ? 'Auto-Save is ON (Click to disable)' : 'Auto-Save is OFF (Click to enable)'">
            <mat-icon class="text-[16px]! size-[16px]! transition-colors" aria-hidden="true"
                [class.text-(--postonsteroids-text-muted)]="!tabStateService.autoSaveEnabled()"
                [class.text-(--postonsteroids-accent)]="tabStateService.autoSaveEnabled()"
                [class.animate-pulse]="tabStateService.isAutoSaving()">
                {{ !tabStateService.autoSaveEnabled() ? 'cloud_off' : (tabStateService.isAutoSaving() ? 'cloud_sync' : 'cloud_done') }}
            </mat-icon>
            <span class="text-[11px] text-(--postonsteroids-text-secondary) font-medium whitespace-nowrap">
                Auto-Save {{ tabStateService.autoSaveEnabled() ? 'On' : 'Off' }}
            </span>
        </button>
        }

        <div
            class="flex items-center h-[30px] rounded-[4px] border border-(--postonsteroids-border) bg-(--postonsteroids-bg-tertiary)">
            <button (click)="saveRequest()" [disabled]="isSaving()"
                class="px-3 flex items-center gap-x-2 text-[12px] font-semibold text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                @if (isSaving()) {
                <mat-icon
                    class="text-[16px]! size-[16px]! animate-spin text-(--postonsteroids-text-secondary)">sync</mat-icon>
                } @else {
                <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary)">save</mat-icon>
                }
                {{ isSaving() ? 'Saving...' : 'Save' }}
            </button>

            @if (isSaving()) {
            <button (click)="cancelSave()" title="Cancel Save"
                class="px-2 flex items-center h-full border-l border-(--postonsteroids-border) hover:bg-red-500/10 text-red-400 transition-colors duration-200 cursor-pointer">
                <mat-icon class="text-[16px]! size-[16px]!">close</mat-icon>
            </button>
            }

            <app-scrollable-select-component [optionValues]="saveOptions" [verticalPosition]="32" [modalWidth]="140"
                [absoluteStartLeft]="false" (outputSelectedValue)="onSaveOptionSelected($event)">
                <div
                    class="px-1.5 h-full border-l border-(--postonsteroids-border) hover:bg-(--postonsteroids-bg-hover) transition-colors duration-200 cursor-pointer flex items-center justify-center">
                    @if (isExporting()) {
                    <mat-icon
                        class="text-[16px]! size-[16px]! animate-spin text-(--postonsteroids-accent)">sync</mat-icon>
                    } @else {
                    <mat-icon class="text-[16px]! size-[16px]!">expand_more</mat-icon>
                    }
                </div>
            </app-scrollable-select-component>
        </div>
    </div>

    <!-- Share Link Modal -->
    <app-share-modal-component [show]="showShareModal()" [link]="generatedLink()" (onClose)="showShareModal.set(false)"
        (onCopy)="copyLink()" />
</div>
