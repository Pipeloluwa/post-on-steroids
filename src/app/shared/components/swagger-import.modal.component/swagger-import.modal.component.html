@if (isOpen()) {
<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-[2px] flex items-center justify-center p-4" (click)="close()">
    <div class="w-full max-w-lg rounded-2xl border border-(--postonsteroids-border) bg-(--postonsteroids-bg-primary) p-6 shadow-xl" (click)="$event.stopPropagation()">
        <div class="flex items-start justify-between gap-x-3 mb-4">
            <div>
                <h3 class="text-lg font-bold text-(--postonsteroids-text-primary)">Import from Swagger</h3>
                <p class="text-[12px] text-(--postonsteroids-text-secondary) mt-1">Enter any Swagger UI or OpenAPI URL (e.g. Swagger UI, JSON/YAML spec, or docs endpoint).</p>
            </div>
            <button (click)="close()" class="text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-accent) rounded-full p-2 cursor-pointer">
                <mat-icon class="text-[20px]! size-[20px]!">close</mat-icon>
            </button>
        </div>

        <label for="swaggerUrlInput" class="block text-[12px] text-(--postonsteroids-text-secondary) mb-2">Swagger / OpenAPI URL</label>
        <input id="swaggerUrlInput" #swaggerUrlInput type="url" [value]="swaggerUrl()" (input)="swaggerUrl.set($any($event.target).value)"
            placeholder="e.g. https://example.com/swagger or /v1/swagger.json"
            class="w-full rounded-2xl border border-(--postonsteroids-border) bg-(--postonsteroids-bg-secondary) px-4 py-3 text-sm text-(--postonsteroids-text-primary) outline-none focus:border-(--postonsteroids-accent) focus:ring-(--postonsteroids-accent)/30"
            aria-label="Swagger URL input" />

        <label class="mt-3 flex items-center gap-2 cursor-pointer select-none text-xs text-(--postonsteroids-text-secondary)">
            <input type="checkbox" [checked]="saveToBackend()" (change)="saveToBackend.set($any($event.target).checked)"
                class="cursor-pointer rounded border-(--postonsteroids-border) text-(--postonsteroids-accent) focus:ring-(--postonsteroids-accent)/30" />
            <span class="cursor-pointer">Save imported Swagger capsule to backend database</span>
        </label>

        @if (statusMessage()) {
        <div class="mt-4 rounded-2xl border px-4 py-3 text-sm" [class.border-red-500]="hasError()" [class.bg-red-500/10]="hasError()"
            [class.text-red-700]="hasError()" [class.border-green-500]="!hasError()" [class.bg-green-500/10]="!hasError()" [class.text-green-700]="!hasError()">
            {{ statusMessage() }}
        </div>
        }

        <div class="mt-6 flex items-center justify-end gap-x-3">
            <button (click)="close()" type="button"
                class="rounded-2xl border border-(--postonsteroids-border) bg-(--postonsteroids-bg-secondary) px-4 py-2 text-sm text-(--postonsteroids-text-secondary) hover:bg-(--postonsteroids-bg-hover) cursor-pointer">Cancel</button>
            <button (click)="importFromSwagger()" type="button"
                class="inline-flex items-center gap-x-2 rounded-2xl bg-(--postonsteroids-accent) px-4 py-2 text-sm font-semibold text-white hover:bg-(--postonsteroids-accent-hover) cursor-pointer">
                <mat-icon class="text-[18px]! size-[18px]!">cloud_download</mat-icon>
                @if (isImporting()) {
                Importing...
                } @else {
                Import Swagger
                }
            </button>
        </div>
    </div>
</div>
}
