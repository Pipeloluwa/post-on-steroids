<nav
    class="w-full h-12 shrink-0 flex items-center justify-between px-4 border-b border-(--postonsteroids-border) bg-(--postonsteroids-bg-secondary)/80 backdrop-blur-md z-40 relative">
    <!-- Left Section: Sidebar Toggle -->
    <div class="flex items-center z-10">
        <button (click)="toggleSidebar()"
            class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-muted) hover:text-(--postonsteroids-text-primary) transition-all cursor-pointer">
            <mat-icon>{{ sidebarService.isCollapsed() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
        </button>
    </div>

    <!-- Center Section: Logo & Title -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none gap-x-3">
        <div
            class="flex items-center gap-x-1.5 px-2 py-1 rounded-lg bg-(--postonsteroids-accent) shadow-lg shadow-(--postonsteroids-accent)/30 select-none pointer-events-auto">
            <mat-icon class="text-white text-[18px] w-4.5 h-4.5 leading-4.5">bolt</mat-icon>
        </div>
        <span
            class="text-[16px] font-black tracking-widest bg-linear-to-r from-(--postonsteroids-text-primary) via-(--postonsteroids-text-primary) to-(--postonsteroids-text-muted) bg-clip-text text-transparent select-none">
            OnSteroids
        </span>
    </div>

    <!-- Right Section: Auth + Utilities -->
    <div class="flex items-center gap-x-3 z-10">
        <a routerLink="/utilities" title="Utilities"
            class="inline-flex items-center gap-x-2 rounded-full bg-(--postonsteroids-bg-tertiary) px-3 py-1.5 text-[12px] font-semibold text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) border border-(--postonsteroids-border) transition-all duration-300">
            <mat-icon class="text-[18px]! size-4.5!">bolt</mat-icon>
            <span>Utilities</span>
        </a>
        @if (isLoggedIn()) {
        <div class="flex items-center gap-x-2">
            <div
                class="flex items-center gap-x-2 pl-1.5 pr-3 py-1 rounded-full bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border)">
                <div
                    class="size-7 tracking-widest rounded-full bg-linear-to-br from-(--postonsteroids-accent) to-(--postonsteroids-accent-hover) flex items-center justify-center text-[10px] font-bold text-white shadow-inner select-none">
                    {{ userInitials() }}
                </div>
                <div class="flex items-center gap-x-1.5 min-w-0">
                    <span
                        class="text-xs font-semibold text-(--postonsteroids-text-secondary) max-w-36 truncate" [title]="userEmail()">
                        {{ userEmail() }}
                    </span>
                    <div
                        class="size-3.5 flex items-center justify-center rounded-full bg-green-500 shadow-sm shadow-green-500/50 shrink-0">
                        <mat-icon
                            class="text-[9px]! size-3.5! flex items-center justify-center text-white font-black">check</mat-icon>
                    </div>
                </div>
            </div>
            <button (click)="onLogout.emit()" title="Sign out"
                class="flex items-center justify-center size-8 rounded-full bg-(--postonsteroids-bg-tertiary) hover:bg-red-500/10 text-(--postonsteroids-text-muted) hover:text-red-400 border border-(--postonsteroids-border) hover:border-red-500/30 transition-all cursor-pointer">
                <mat-icon class="text-[16px]! size-4!">logout</mat-icon>
            </button>
        </div>
        } @else {
        <a routerLink="/login"
            class="flex items-center gap-x-2 px-3 py-1.5 rounded-full bg-(--postonsteroids-bg-tertiary) hover:bg-(--postonsteroids-bg-hover) border border-(--postonsteroids-border) transition-all duration-300 cursor-pointer group">
            <mat-icon
                class="text-[18px]! size-4.5! text-(--postonsteroids-text-secondary) group-hover:text-(--postonsteroids-text-primary)">account_circle</mat-icon>
            <span
                class="text-[12px] font-bold text-(--postonsteroids-text-secondary) group-hover:text-(--postonsteroids-text-primary)">Login</span>
        </a>
        }
    </div>
</nav>
