<nav
    class="w-full h-12 shrink-0 border-b border-(--postonsteroids-border) bg-(--postonsteroids-bg-secondary) z-40 relative px-4">
    <div class="w-full h-full flex items-center justify-between gap-4">
        
        <!-- Left Section: Sidebar Toggle & Menu Tabs (File, About, Help/Updates) -->
        <div class="flex items-center gap-x-2 shrink-0">
            <button (click)="toggleSidebar()"
                class="flex items-center justify-center w-8 h-8 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-muted) hover:text-(--postonsteroids-text-primary) transition-all cursor-pointer"
                [title]="sidebarService.isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
                <mat-icon class="text-[20px]! size-[20px]!">{{ sidebarService.isCollapsed() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
            </button>

            <!-- Menu Tabs: File, About, Help/Updates -->
            <div class="flex items-center gap-x-0.5 border-l border-(--postonsteroids-border) pl-2">
                <!-- File Menu Dropdown Trigger -->
                <div class="relative">
                    <button (click)="toggleFileMenu($event)"
                        class="flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded-md transition-all cursor-pointer select-none hover:bg-(--postonsteroids-bg-hover) hover:text-(--postonsteroids-text-primary)"
                        [class.bg-(--postonsteroids-bg-hover)]="showFileMenu()"
                        [class.text-(--postonsteroids-text-primary)]="showFileMenu()"
                        [class.text-(--postonsteroids-text-secondary)]="!showFileMenu()">
                        <span>File</span>
                        <mat-icon class="text-[14px]! size-[14px]! opacity-60">expand_more</mat-icon>
                    </button>

                    <!-- File Menu Dropdown -->
                    @if (showFileMenu()) {
                        <div (click)="$event.stopPropagation()"
                            class="absolute top-full left-0 mt-1.5 w-56 p-1.5 rounded-xl bg-(--postonsteroids-bg-secondary) border border-(--postonsteroids-border) shadow-2xl z-50 animate-fadeIn text-xs flex flex-col gap-0.5">
                            
                            <button (click)="newRequest()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-(--postonsteroids-accent) transition-colors">add_circle</mat-icon>
                                    <span>New Request</span>
                                </div>
                                <span class="text-[10px] text-(--postonsteroids-text-muted) font-mono">Ctrl+N</span>
                            </button>

                            <button (click)="newCapsule()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-amber-400 transition-colors">folder_special</mat-icon>
                                    <span>New Capsule...</span>
                                </div>
                            </button>

                            <div class="h-px bg-(--postonsteroids-border) my-1"></div>

                            <button (click)="saveCurrentRequest()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-emerald-400 transition-colors">save</mat-icon>
                                    <span>Save Request</span>
                                </div>
                                <span class="text-[10px] text-(--postonsteroids-text-muted) font-mono">Ctrl+S</span>
                            </button>

                            <button (click)="importOpen()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-blue-400 transition-colors">file_upload</mat-icon>
                                    <span>Import / Open...</span>
                                </div>
                                <span class="text-[10px] text-(--postonsteroids-text-muted) font-mono">Ctrl+O</span>
                            </button>

                            <div class="h-px bg-(--postonsteroids-border) my-1"></div>

                            <button (click)="exportEndpoint()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-purple-400 transition-colors">file_download</mat-icon>
                                    <span>Export Endpoint</span>
                                </div>
                            </button>

                            <button (click)="exportCapsule()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-(--postonsteroids-bg-hover) text-(--postonsteroids-text-primary) transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-secondary) group-hover:text-indigo-400 transition-colors">archive</mat-icon>
                                    <span>Export Capsule</span>
                                </div>
                            </button>

                            <div class="h-px bg-(--postonsteroids-border) my-1"></div>

                            <button (click)="closeActiveTab()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-red-500/10 text-(--postonsteroids-text-primary) hover:text-red-500 transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-muted) group-hover:text-red-400 transition-colors">close</mat-icon>
                                    <span>Close Active Tab</span>
                                </div>
                            </button>

                            <button (click)="closeAllTabs()"
                                class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-red-500/10 text-(--postonsteroids-text-primary) hover:text-red-500 transition-all cursor-pointer text-left w-full group">
                                <div class="flex items-center gap-2">
                                    <mat-icon class="text-[16px]! size-[16px]! text-(--postonsteroids-text-muted) group-hover:text-red-400 transition-colors">clear_all</mat-icon>
                                    <span>Close All Tabs</span>
                                </div>
                            </button>
                        </div>
                    }
                </div>

                <!-- About Menu Tab -->
                <button (click)="openAbout()"
                    class="px-2.5 py-1 text-xs font-medium text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) rounded-md transition-all cursor-pointer select-none">
                    About
                </button>

                <!-- Help / Updates Menu Tab -->
                <button (click)="openHelp()"
                    class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) rounded-md transition-all cursor-pointer select-none">
                    <span>Help / Updates</span>
                    <span class="size-1.5 rounded-full bg-(--postonsteroids-accent)"></span>
                </button>
            </div>
        </div>

        <!-- Center Section: Logo & Brand Title (Positioned cleanly in the middle between sections) -->
        <a routerLink="/steroid" class="flex-1 flex items-center justify-center gap-x-2 select-none cursor-pointer group no-underline">
            <div class="flex items-center justify-center size-6 rounded-lg bg-(--postonsteroids-accent) shadow-sm shadow-(--postonsteroids-accent)/30 group-hover:scale-105 transition-transform">
                <mat-icon class="text-white text-[15px]! size-[15px]!">bolt</mat-icon>
            </div>
            <span class="text-[14px] font-bold tracking-wider text-(--postonsteroids-text-primary) group-hover:text-(--postonsteroids-accent) transition-colors">
                OnSteroids
            </span>
        </a>

        <!-- Right Section: Utilities + Auth (Permanently pinned to far right) -->
        <div class="flex items-center justify-end gap-x-3 shrink-0">
            <a routerLink="/utilities" title="Utilities"
                class="inline-flex items-center gap-x-2 rounded-full bg-(--postonsteroids-bg-tertiary) px-3 py-1 text-[12px] font-medium text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-text-primary) hover:bg-(--postonsteroids-bg-hover) border border-(--postonsteroids-border) transition-all duration-200">
                <mat-icon class="text-[16px]! size-4!">handyman</mat-icon>
                <span>Utilities</span>
            </a>

            @if (isLoggedIn()) {
            <div class="flex items-center gap-x-2">
                <div
                    class="flex items-center gap-x-2 pl-1.5 pr-3 py-1 rounded-full bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border)">
                    <div
                        class="size-6 tracking-wider rounded-full bg-linear-to-br from-(--postonsteroids-accent) to-(--postonsteroids-accent-hover) flex items-center justify-center text-[10px] font-bold text-white shadow-inner select-none">
                        {{ userInitials() }}
                    </div>
                    <div class="flex items-center gap-x-1.5 min-w-0">
                        <span class="text-xs font-medium text-(--postonsteroids-text-primary) max-w-40 truncate"
                            [title]="userEmail()">
                            {{ userEmail() }}
                        </span>
                        <div class="size-3.5 flex items-center justify-center rounded-full bg-green-500 shadow-sm shadow-green-500/50 shrink-0">
                           <mat-icon class="text-[9px]! size-3.5! text-center content-center text-white font-bold">check</mat-icon>
                        </div>
                    </div>
                </div>
                <button (click)="onLogout.emit()" title="Sign out"
                    class="flex items-center justify-center size-8 rounded-full bg-(--postonsteroids-bg-tertiary) hover:bg-red-500/10 text-(--postonsteroids-text-muted) hover:text-red-400 border border-(--postonsteroids-border) hover:border-red-500/30 transition-all cursor-pointer">
                    <mat-icon class="text-[16px]! size-4!">logout</mat-icon>
                </button>
            </div>
            } @else {
            <button (click)="onToggleAuth.emit()"
                class="flex items-center gap-x-2 px-3 py-1.5 rounded-full bg-(--postonsteroids-bg-tertiary) hover:bg-(--postonsteroids-bg-hover) border border-(--postonsteroids-border) transition-all duration-200 cursor-pointer group">
                <mat-icon
                    class="text-[18px]! size-4.5! text-(--postonsteroids-text-secondary) group-hover:text-(--postonsteroids-text-primary)">account_circle</mat-icon>
                <span
                    class="text-[12px] font-medium text-(--postonsteroids-text-secondary) group-hover:text-(--postonsteroids-text-primary)">Login</span>
            </button>
            }
        </div>
    </div>

    <!-- Modals (Safely outside the inner flex layout) -->
    <app-about-modal-component [show]="showAboutModal()" (onClose)="showAboutModal.set(false)" />
    <app-help-updates-modal-component [show]="showHelpModal()" (onClose)="showHelpModal.set(false)" />
    <app-create-capsule-modal #createCapsuleModal />
</nav>
