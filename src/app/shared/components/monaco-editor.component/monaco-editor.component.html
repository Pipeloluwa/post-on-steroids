@if (isBrowser) {
<div class="relative w-full h-full overflow-hidden">
    @if (!isEditorLoaded()) {
        <div class="absolute inset-0 z-40 flex items-center justify-center bg-(--postonsteroids-bg-primary) bg-opacity-95 backdrop-blur-sm transition-all duration-300">
            <div class="flex flex-col items-center justify-center gap-y-5 p-8 rounded-xl border border-(--postonsteroids-border) bg-(--postonsteroids-bg-darker) shadow-2xl">
                <div class="relative w-16 h-16">
                    <!-- Outer rotating ring -->
                    <div class="absolute inset-0 border-4 border-transparent border-t-(--postonsteroids-accent) border-r-(--postonsteroids-accent) rounded-full animate-spin"></div>
                    <!-- Inner pulsating core -->
                    <div class="absolute inset-4 bg-(--postonsteroids-accent) rounded-full animate-pulse opacity-50"></div>
                </div>
                <span class="text-[15px] font-bold tracking-[0.2em] text-(--postonsteroids-accent) animate-pulse uppercase">Initializing Editor</span>
            </div>
        </div>
    }

    <ngx-monaco-editor class="w-full h-full monaco-wrapper-custom block" [options]="monacoOptions()"
        [class.opacity-50]="disabled()" (onInit)="onEditorInit($event)">
    </ngx-monaco-editor>

    @if (enableFloatingVar() && showFloatingVar()) {
    <button type="button"
        (mousedown)="onFloatingVarMouseDown($event)"
        (click)="onFloatingVarClick($event)"
        [style.top.px]="floatingVarPosition().top"
        [style.left.px]="floatingVarPosition().left"
        title="Add to Global Variables"
        aria-label="Add highlighted field to Global Variables"
        class="absolute z-50 flex items-center gap-x-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-(--postonsteroids-accent) text-white shadow-lg hover:brightness-110 active:scale-95 transition-transform duration-100 cursor-pointer pointer-events-auto border border-white/20 select-none">
        <span class="text-[12px] font-bold leading-none">+</span>
        <span class="leading-none">var</span>
    </button>
    }
</div>
}
