@if (isBrowser) {
<div class="relative w-full h-full overflow-hidden">
    @if (!isEditorLoaded()) {
        <div class="absolute inset-0 z-40 flex items-center justify-center bg-(--postonsteroids-bg-primary)">
            <div class="flex items-center gap-x-2.5 text-(--postonsteroids-text-muted)">
                <mat-icon class="animate-spin text-[20px]! size-[20px]!">sync</mat-icon>
                <span class="text-[14px]">Loading editor...</span>
            </div>
        </div>
    }

    <ngx-monaco-editor class="w-full h-full monaco-wrapper-custom block" [options]="monacoOptions()"
        [class.opacity-50]="disabled()" (onInit)="onEditorInit($event)">
    </ngx-monaco-editor>

    @if (enableFloatingVar() && showFloatingVar()) {
    <button type="button"
        (mousedown)="onFloatingVarMouseDown($event)"
        (click)="onFloatingVarClick($event)"
        [style.top.px]="floatingVarPosition().top"
        [style.left.px]="floatingVarPosition().left"
        title="Add to Global Variables"
        aria-label="Add highlighted field to Global Variables"
        class="absolute z-50 flex items-center gap-x-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-(--postonsteroids-accent) text-white shadow-lg hover:brightness-110 active:scale-95 transition-transform duration-100 cursor-pointer pointer-events-auto border border-white/20 select-none">
        <span class="text-[12px] font-bold leading-none">+</span>
        <span class="leading-none">var</span>
    </button>
    }

    <!-- Stored Variable Hover Modal (anchored tightly with hover bridge so moving into it stays locked) -->
    @if (hoveredVariable(); as hover) {
    <div class="fixed z-[100] -translate-x-1/2"
        [class.-mt-1.5]="hover.placement === 'below'"
        [class.pt-2]="hover.placement === 'below'"
        [class.-mb-1.5]="hover.placement === 'above'"
        [class.pb-2]="hover.placement === 'above'"
        [style.left.px]="hover.x"
        [style.top.px]="hover.placement === 'below' ? hover.y : null"
        [style.bottom.px]="hover.placement === 'above' ? hover.y : null"
        (mouseenter)="onPopupMouseEnter()"
        (mouseleave)="onPopupMouseLeave()">
        <div class="bg-(--postonsteroids-bg-secondary) border border-(--postonsteroids-border) rounded-lg shadow-xl p-2.5 flex flex-col gap-1.5 min-w-[220px]">
            <div class="flex justify-between items-center text-[11px] font-bold">
                <span class="text-(--postonsteroids-text-muted)">Global Variable</span>
            </div>
            <div class="text-[12px] font-mono font-semibold text-(--postonsteroids-text-primary) truncate">
                {{ hover.key }}
            </div>
            <input type="text"
                [value]="hover.val"
                (input)="updateVariableValue(hover.key, $any($event.target).value)"
                class="bg-(--postonsteroids-bg-tertiary) border border-(--postonsteroids-border) rounded px-2 py-1 text-[12px] text-(--postonsteroids-text-primary) outline-none focus:border-(--postonsteroids-accent) w-full"
                placeholder="Enter value" />
        </div>
    </div>
    }
</div>
}
