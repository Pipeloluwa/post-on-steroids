<nav [class.md:w-16]="sidebarService.isCollapsed()" [class.md:w-42]="!sidebarService.isCollapsed()"
    [class.h-0]="sidebarService.isCollapsed()" [class.h-16]="!sidebarService.isCollapsed()" [class.md:h-full]="true"
    [class.opacity-0]="sidebarService.isCollapsed()" [class.md:opacity-100]="true"
    [class.pointer-events-none]="sidebarService.isCollapsed()" [class.md:pointer-events-auto]="true"
    [class.transition-none]="!sidebarService.isHydrated()"
    class="w-full flex flex-row md:flex-col transition-all duration-300 overflow-x-auto overflow-y-hidden md:overflow-hidden shrink-0 z-20 bg-(--postonsteroids-bg-secondary) border-t md:border-t-0 md:border-r border-(--postonsteroids-border)">
    
    <ul class="flex flex-row md:flex-col gap-x-2 md:gap-y-2 p-2 md:mt-4 flex-1 items-center md:items-stretch justify-start md:justify-start">
        @for (item of menu(); track item.name) {
        <li [routerLink]="item.path"
            routerLinkActive
            [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
            #rla="routerLinkActive"
            class="h-[45px] py-2 px-3 capitalize flex items-center gap-3 rounded-xl cursor-pointer transition-all duration-300"
            [class.bg-(--postonsteroids-accent)]="rla.isActive"
            [class.text-white]="rla.isActive"
            [class.shadow-lg]="rla.isActive"
            [class.shadow-(--postonsteroids-accent)/30]="rla.isActive"
            [class.text-(--postonsteroids-text-muted)]="!rla.isActive"
            [class.hover:text-(--postonsteroids-text-primary)]="!rla.isActive"
            [class.hover:bg-(--postonsteroids-bg-hover)]="!rla.isActive">
            <mat-icon class="text-[20px]! size-[20px]! shrink-0">{{ item.icon }}</mat-icon>
            @if (!sidebarService.isCollapsed()) {
            <span class="hidden md:inline text-[13px] font-bold tracking-tight whitespace-nowrap overflow-hidden text-ellipsis">{{ item.name }}</span>
            }
        </li>
        }
    </ul>

    <div class="md:mt-auto p-1.5 md:p-3 flex flex-row md:flex-col items-center justify-center gap-1.5 md:gap-y-2 shrink-0">
        @if (authService.isLoggedIn()) {
        <button type="button" (click)="openChangePassword()"
            title="Change Password"
            class="h-9 px-2.5 md:h-[40px] md:w-full flex items-center justify-center md:justify-start gap-2.5 rounded-xl cursor-pointer transition-all duration-200 text-(--postonsteroids-text-secondary) hover:text-(--postonsteroids-accent) hover:bg-(--postonsteroids-bg-hover) border border-transparent hover:border-(--postonsteroids-border)/60"
            [class.md:justify-center]="sidebarService.isCollapsed()">
            <mat-icon class="text-[19px]! size-[19px]! shrink-0">lock_reset</mat-icon>
            @if (!sidebarService.isCollapsed()) {
            <span class="hidden md:inline text-[12px] font-bold tracking-tight whitespace-nowrap overflow-hidden text-ellipsis">Password</span>
            }
        </button>
        }

        <div class="flex items-center justify-between p-1 bg-(--postonsteroids-bg-tertiary) rounded-xl border border-(--postonsteroids-border)/50 transition-all duration-300 gap-1 md:gap-y-4"
            [class.md:flex-col]="sidebarService.isCollapsed()">
            <button (click)="themeService.setTheme('light')" 
                class="flex-1 flex items-center justify-center py-1.5 rounded-lg transition-all duration-200 cursor-pointer w-full"
                [class.bg-(--postonsteroids-bg-primary)]="themeService.theme() === 'light'"
                [class.text-(--postonsteroids-accent)]="themeService.theme() === 'light'"
                [class.shadow-sm]="themeService.theme() === 'light'">
                <mat-icon class="text-[18px]! size-[18px]!">light_mode</mat-icon>
            </button>
            <button (click)="themeService.setTheme('dark')" 
                class="flex-1 flex items-center justify-center py-1.5 rounded-lg transition-all duration-200 cursor-pointer w-full"
                [class.bg-(--postonsteroids-bg-primary)]="themeService.theme() === 'dark'"
                [class.text-(--postonsteroids-accent)]="themeService.theme() === 'dark'"
                [class.shadow-sm]="themeService.theme() === 'dark'">
                <mat-icon class="text-[18px]! size-[18px]!">dark_mode</mat-icon>
            </button>
            <button (click)="themeService.setTheme('system')" 
                class="flex-1 flex items-center justify-center py-1.5 rounded-lg transition-all duration-200 cursor-pointer w-full"
                [class.bg-(--postonsteroids-bg-primary)]="themeService.theme() === 'system'"
                [class.text-(--postonsteroids-accent)]="themeService.theme() === 'system'"
                [class.shadow-sm]="themeService.theme() === 'system'">
                <mat-icon class="text-[18px]! size-[18px]!">settings_brightness</mat-icon>
            </button>
        </div>
    </div>
</nav>
